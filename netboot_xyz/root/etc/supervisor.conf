[supervisord]
nodaemon=true
user=root

[unix_http_server]
file=/run/supervisord.sock
chmod=0700

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

[supervisorctl]
serverurl=unix:///run/supervisord.sock

[program:nginx]
command = /usr/sbin/nginx -c /config/nginx/nginx.conf
startretries = 3
startsecs = 3
daemon=off
priority = 4
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:webapp]
environment=NODE_ENV="production",PORT=3000,HOST="0.0.0.0"
command=/usr/bin/node app.js
user=nbxyz
directory=/app
priority = 2
startsecs = 5
startretries = 3
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:in.tftpd]
command=/bin/bash /tftpd.sh
stdout_logfile=/config/tftpd.log
redirect_stderr=true
priority = 3

[program:ha-sensors]
command=/bin/bash /ha-sensors.sh
priority = 5
startsecs = 10
autorestart = true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
