---
name: Test netboot.xyz

on:
  push:
    branches:
      - main
      - master
    paths:
      - 'netboot_xyz/**'
      - '.github/workflows/test-netboot-xyz.yaml'
  pull_request:
    branches:
      - main
      - master
    paths:
      - 'netboot_xyz/**'
      - '.github/workflows/test-netboot-xyz.yaml'
  workflow_dispatch:
  schedule:
    - cron: '0 6 * * 1'

jobs:
  shellcheck:
    name: ShellCheck (add-on scripts)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Run ShellCheck
        uses: ludeeus/action-shellcheck@master
        with:
          scandir: ./netboot_xyz/root
          severity: warning

  nginx-config:
    name: nginx configuration syntax
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Validate nginx configs
        run: |
          sudo apt-get update
          sudo apt-get install -y nginx gettext-base
          # Config uses `user nbxyz;` (created in the add-on image); create it for nginx -t
          sudo useradd -r -M -s /usr/sbin/nologin nbxyz || true
          export NETBOOTXYZ_VERSION=0.7.6
          export NGINX_PORT=8080
          mkdir -p /tmp/netboot-config/nginx/site-confs /tmp/netboot-config/log/nginx
          cp netboot_xyz/root/defaults/nginx.conf /tmp/netboot-config/nginx/nginx.conf
          envsubst '${NGINX_PORT}' < netboot_xyz/root/defaults/default > /tmp/netboot-config/nginx/site-confs/default
          sed -i 's#/config#/tmp/netboot-config#g' /tmp/netboot-config/nginx/nginx.conf
          sed -i 's#/config#/tmp/netboot-config#g' /tmp/netboot-config/nginx/site-confs/default
          # Writable pid path; user nbxyz for nginx -t
          sed -i 's#pid /run/nginx.pid;#pid /tmp/netboot-config/nginx.pid;#' /tmp/netboot-config/nginx/nginx.conf
          sudo nginx -t -c /tmp/netboot-config/nginx/nginx.conf

  npm-audit:
    name: npm audit (webapp dependencies)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Install webapp and run npm audit
        run: |
          NETBOOTXYZ_VERSION=$(grep 'NETBOOTXYZ_VERSION=' netboot_xyz/Dockerfile | head -1 | cut -d'"' -f2)
          echo "netboot.xyz webapp version: ${NETBOOTXYZ_VERSION}"
          curl -fsSL -o /tmp/webapp.tar.gz \
            "https://github.com/netbootxyz/webapp/archive/${NETBOOTXYZ_VERSION}.tar.gz"
          mkdir -p /tmp/webapp
          tar xzf /tmp/webapp.tar.gz -C /tmp/webapp --strip-components=1
          cd /tmp/webapp
          npm install --omit=dev
          npm install systeminformation@5.27.14 express@4.22.2 js-yaml@4.3.0 --save --omit=dev
          npm audit fix --omit=dev
          npm audit --omit=dev --audit-level=high

  smoke:
    name: Container smoke test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Build image
        run: |
          docker build \
            --build-arg BUILD_VERSION=1.3.0 \
            --build-arg BUILD_NAME=netboot.xyz \
            --build-arg BUILD_DESCRIPTION=smoke \
            --build-arg BUILD_REPOSITORY=henryhst/hassio-addons \
            -t netboot_xyz:test ./netboot_xyz

      - name: Run smoke test
        run: |
          set -euo pipefail
          data_dir="$(mktemp -d)"
          config_dir="$(mktemp -d)"
          opts='{"enable_secure_boot":false,"enable_ha_sensors":false,"sensor_poll_interval":60}'
          echo "${opts}" > "${data_dir}/options.json"

          # Pre-seed menus so init skips GitHub downloads (H2/H7) — smoke tests runtime only
          mkdir -p "${config_dir}/menus/remote" "${config_dir}/menus/local" "${config_dir}/status"
          printf '%s\n' '#!ipxe' > "${config_dir}/menus/remote/menu.ipxe"
          printf '%s\n' '#!ipxe' > "${config_dir}/menus/menu.ipxe"
          printf '%s' '3.0.3' > "${config_dir}/menuversion.txt"
          echo "[smoke-debug] H7 preseeded menu.ipxe + menuversion 3.0.3"

          docker image inspect netboot_xyz:test >/dev/null
          echo "[smoke-debug] H6 image present"

          # High host ports; cidfile outside bind mounts (H10)
          rm -f /tmp/netboot-smoke.cid
          echo "[smoke-debug] H1 docker run -p 13000:3000 -p 1069:69/udp"
          docker run -d --name netboot-smoke \
            --cidfile=/tmp/netboot-smoke.cid \
            -v "${data_dir}:/data" \
            -v "${config_dir}:/config" \
            -p 13000:3000 \
            -p 1069:69/udp \
            netboot_xyz:test
          cid="$(cat /tmp/netboot-smoke.cid)"
          echo "[smoke-debug] H1 cid=${cid}"

          cleanup() {
            local id="${cid:-}"
            echo "[smoke-debug] --- docker ps -a ---"
            docker ps -a --filter "name=netboot-smoke" || true
            if [[ -n "${id}" ]]; then
              fmt='{{.State.Status}}/{{.State.ExitCode}}/{{.State.Error}}'
              st=$(docker inspect -f "${fmt}" "${id}" 2>/dev/null || echo gone)
              echo "[smoke-debug] container state=${st}"
              echo "[smoke-debug] --- docker logs ---"
              docker logs "${id}" 2>&1 || true
              docker rm -f "${id}" >/dev/null 2>&1 || true
            fi
            rm -f /tmp/netboot-smoke.cid
            sudo rm -rf "${data_dir}" "${config_dir}"
          }
          trap cleanup EXIT

          # With preseed, init should finish in seconds; fail fast if not running
          sleep 8
          state=$(docker inspect -f '{{.State.Running}}' "${cid}")
          echo "[smoke-debug] H2 running_after_8s=${state}"
          docker logs "${cid}" 2>&1 | tail -50 || true
          if [[ "${state}" != "true" ]]; then
            echo "[smoke-debug] H2 FAIL container exited early"
            exit 1
          fi

          web_up=0
          for i in $(seq 1 60); do
            state=$(docker inspect -f '{{.State.Running}}' "${cid}")
            if [[ "${state}" != "true" ]]; then
              echo "[smoke-debug] H2 FAIL not running at iter=${i}"
              exit 1
            fi
            if curl -fsS "http://127.0.0.1:13000/" >/dev/null 2>&1; then
              echo "[smoke-debug] H2 web UI up at iter=${i}"
              web_up=1
              break
            fi
            sleep 2
          done
          if [[ "${web_up}" -ne 1 ]]; then
            echo "[smoke-debug] H2 FAIL web UI never responded"
            exit 1
          fi

          docker logs "${cid}" 2>&1 | grep -q "Home Assistant Add-on Version"
          echo "[smoke-debug] H5 banner ok"
          test -f "${config_dir}/menus/menu.ipxe"
          echo "[smoke-debug] menu.ipxe present"

          tftpd_status="$(docker exec "${cid}" \
            supervisorctl -c /etc/supervisor.conf status in.tftpd || true)"
          echo "[smoke-debug] H3 tftpd_status=${tftpd_status}"
          echo "${tftpd_status}" | grep -q RUNNING
          echo "[smoke-debug] H3 tftpd RUNNING"
          echo "smoke OK"
